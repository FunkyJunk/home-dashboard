version: "3.9"

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:latest
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host   # needed for device discovery (Homey/Alexa on the LAN)
    volumes:
      - ./volumes/homeassistant:/config
    environment:
      - TZ=America/New_York

  backend:
    # Swap for `build: ../backend` if you'd rather build on the NAS directly.
    image: ghcr.io/funkyjunk/home-dashboard-backend:latest
    container_name: dashboard-backend
    labels:
      # Opt in to Watchtower auto-updates (see the watchtower service below).
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped
    env_file: .env
    environment:
      # REQUIRED, not cosmetic. node:20-alpine has no timezone configured, so
      # without this the backend runs in UTC while reminders are stored and
      # compared as local wall time - a 7pm reminder pushed at 3pm Eastern, and
      # all-day reminders at 4am. The dashboard displayed the right time the
      # whole while, because the browser parses in its own zone, so the UI and
      # the notification disagreed silently. Set after the fact; the other
      # services had it from the start and the backend was simply missed.
      #
      # An explicit value here also wins over anything in .env, so a stale TZ
      # line there cannot quietly change when reminders fire.
      - TZ=America/New_York
    volumes:
      - ./volumes/backend:/app/data   # persists which receipts have been resolved
    depends_on:
      - homeassistant

  # Auto-deploy. Polls the registry and restarts a container when a newer image
  # appears, so a push to main reaches the NAS without anyone SSH-ing in - which
  # is what makes it possible to ship changes from a phone or laptop away from
  # home.
  #
  # --label-enable is the important flag: ONLY containers carrying the
  # watchtower.enable label are touched. Home Assistant is deliberately excluded
  # - an unattended HA update can break device integrations, and the worst time
  # to discover that is while travelling. cloudflared is excluded too; it already
  # runs with --no-autoupdate and a broken tunnel would cut off remote access.
  #
  # Note this mounts the Docker socket, which is effectively root control of the
  # Docker daemon. That is how Watchtower works, and it is an accepted trade-off
  # on a personal NAS - but it is real, so nothing else should be added here
  # casually.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: dashboard-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=America/New_York
    command: --label-enable --cleanup --interval 300

  # Cloudflare Tunnel. Connects OUTBOUND to Cloudflare, so the dashboard is
  # reachable remotely with no inbound port forwarded on the router at all -
  # there is nothing on the public internet to scan or knock on.
  #
  # Runs here rather than on a desktop for two reasons: the NAS is on 24/7 (a
  # connector on a PC dies whenever it sleeps, which is exactly when remote
  # access is wanted), and being on this compose network lets the tunnel address
  # nginx as `frontend:80` without publishing any host port.
  #
  # The token comes from .env via compose interpolation rather than being passed
  # on the command line, so it never lands in shell history or `ps` output.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dashboard-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

  frontend:
    image: ghcr.io/funkyjunk/home-dashboard-frontend:latest
    container_name: dashboard-frontend
    labels:
      # Opt in to Watchtower auto-updates (see the watchtower service below).
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"   # HTTPS - required for the receipts feature (File System Access API needs a secure context)
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
