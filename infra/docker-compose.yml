version: "3.9"

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host   # needed for device discovery (Homey/Alexa on the LAN)
    volumes:
      - ./volumes/homeassistant:/config
    environment:
      - TZ=America/New_York

  backend:
    # Swap for `build: ../backend` if you'd rather build on the NAS directly.
    image: ghcr.io/<github-username>/home-dashboard-backend:latest
    container_name: dashboard-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - homeassistant

  frontend:
    image: ghcr.io/<github-username>/home-dashboard-frontend:latest
    container_name: dashboard-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
