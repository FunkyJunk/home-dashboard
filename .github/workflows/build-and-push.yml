name: Build and push images

# Tests run on pull requests too, so a branch gets a verdict before it is
# merged. The image build only runs on main - a PR has nothing to deploy to.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the runtime image in backend/Dockerfile (node:20-alpine), so
          # the tests run against the Node the NAS actually executes.
          node-version: "20"

      # npm ci, so a transitive dependency update cannot change what the gate
      # tested. Note this pins CI only - backend/Dockerfile still copies just
      # package.json and runs `npm install --omit=dev`, so the published image
      # resolves dependencies fresh. See README for why that is a separate fix.
      - run: npm ci
        working-directory: ./backend

      # The suite pins TZ itself (test/helpers/env.mjs) rather than trusting the
      # runner, which is UTC - a DST test would otherwise pass for the wrong
      # reason.
      - run: npm test
        working-directory: ./backend

  build:
    # The gate. Watchtower deploys :latest unattended within 5 minutes of a
    # push, so a red suite must stop the image from ever being published rather
    # than being noticed afterwards on the wall tablet.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A single timestamp shared by both matrix jobs would be nicer, but each
      # job runs on its own runner - so each stamps its own build time, and the
      # two can differ by seconds. The commit is what actually identifies a
      # build; the time is for reading at a glance.
      - id: stamp
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/funkyjunk/home-dashboard-${{ matrix.service }}:latest
          # Surfaced at /api/build and on Settings > Build, so "did my push
          # actually reach the NAS?" is answerable from the dashboard.
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}
            BUILD_TIME=${{ steps.stamp.outputs.time }}
            BUILD_RUN_NUMBER=${{ github.run_number }}
            BUILD_RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            BUILD_IMAGE=ghcr.io/funkyjunk/home-dashboard-${{ matrix.service }}:latest
