<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; Home Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg, #12161c); color:var(--text, #ece7db);
    font-family:'IBM Plex Mono', ui-monospace, monospace; padding:1.5rem;
  }
  .card{
    background:var(--panel, #1b212b); border:1px solid var(--panel-line, #2a323f);
    border-radius:calc(var(--radius-scale, 1) * 8px);
    padding:2rem; width:100%; max-width:380px; text-align:center;
  }
  h1{font-size:1.05rem; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim, #8b93a1); margin:0 0 .4rem;}
  .sub{font-size:.8rem; color:var(--text-dim, #8b93a1); margin-bottom:1.6rem; line-height:1.5;}
  button{
    width:100%; font-family:inherit; font-size:.9rem; cursor:pointer;
    padding:.85em 1em; border-radius:calc(var(--radius-scale, 1) * 6px);
    background:var(--teal-dim, #2c5b56); border:1px solid var(--teal, #4fb8ae); color:var(--teal, #4fb8ae);
    font-weight:600;
  }
  button:hover:not(:disabled){filter:brightness(1.2);}
  button:disabled{opacity:.5; cursor:default;}
  button.secondary{background:none; border-color:var(--panel-line, #2a323f); color:var(--text-dim, #8b93a1); font-weight:400; margin-top:.6rem;}
  .msg{margin-top:1.1rem; font-size:.8rem; line-height:1.5; min-height:1.2em;}
  .msg.error{color:var(--coral, #e2574c);}
  .msg.ok{color:var(--teal, #4fb8ae);}
  .hint{margin-top:1.4rem; font-size:.72rem; color:var(--text-dim, #8b93a1); line-height:1.6; text-align:left;}
  code{background:var(--bg-inset, #0d1116); padding:.1em .35em; border-radius:3px; font-size:.95em;}
</style>
</head>
<body>
<div class="card">
  <h1>Home Dashboard</h1>
  <div class="sub" id="sub">Checking&hellip;</div>

  <div id="actions" style="display:none;">
    <button type="button" id="signin-btn">Sign in</button>
    <button type="button" class="secondary" id="register-btn" style="display:none;">Register this device</button>
  </div>

  <div class="msg" id="msg"></div>
  <div class="hint" id="hint" style="display:none;"></div>
</div>

<script src="theme.js"></script>
<script src="passkey.js"></script>
<script>
const msgEl = document.getElementById('msg');
const subEl = document.getElementById('sub');
const hintEl = document.getElementById('hint');
const actionsEl = document.getElementById('actions');
const signinBtn = document.getElementById('signin-btn');
const registerBtn = document.getElementById('register-btn');

function say(text, kind){
  msgEl.textContent = text || '';
  msgEl.className = 'msg' + (kind ? ' ' + kind : '');
}
function showHint(html){
  hintEl.innerHTML = html;
  hintEl.style.display = '';
}

// Where to land after signing in. Only same-origin relative paths are honoured -
// an absolute URL in ?next= would make this an open redirect.
function nextPath(){
  const raw = new URLSearchParams(location.search).get('next') || '/index.html';
  return /^\/[^/\\]/.test(raw) ? raw : '/index.html';
}

async function init(){
  if (!passkeySupported()){
    subEl.textContent = 'This browser cannot use passkeys.';
    showHint('WebAuthn needs a modern browser over HTTPS. Open this page at <code>https://dash.polypimp.com</code> — an IP address will never work, because a Relying Party ID must be a domain name.');
    return;
  }

  let status;
  try {
    status = await fetch('/api/auth/status').then(r => r.json());
  } catch (e){
    subEl.textContent = 'Cannot reach the dashboard.';
    say(e.message, 'error');
    return;
  }

  if (!status.configured){
    subEl.textContent = 'Passkeys are not configured on the server.';
    showHint('<code>WEBAUTHN_RP_ID</code> and <code>WEBAUTHN_ORIGIN</code> must be set in the backend environment.');
    return;
  }

  // Already signed in, or nothing is enforcing yet - either way, straight through.
  if (status.authenticated && status.enforced){
    location.href = nextPath();
    return;
  }

  actionsEl.style.display = '';

  if (status.credentialCount === 0){
    // Bootstrap: no passkey exists, so the API is still open and this is the
    // one moment registration is possible without already being signed in.
    subEl.textContent = 'No passkey registered yet.';
    signinBtn.style.display = 'none';
    registerBtn.style.display = '';
    registerBtn.className = '';        // promote it to the primary action
    registerBtn.textContent = 'Register this device';
    showHint('Registering the first passkey <strong>switches authentication on</strong>. Until then the API is open to anything that can reach it. Use the device you want to sign in with — Face ID on iPhone, or Windows Hello on a PC.');
  } else {
    subEl.textContent = 'Sign in with your passkey.';
    signinBtn.textContent = 'Sign in with Face ID';
  }
}

signinBtn.addEventListener('click', async () => {
  signinBtn.disabled = true;
  say('Waiting for your device…');
  try {
    await loginWithPasskey();
    say('Signed in.', 'ok');
    location.href = nextPath();
  } catch (e){
    say(e.message || 'sign-in failed', 'error');
    signinBtn.disabled = false;
  }
});

registerBtn.addEventListener('click', async () => {
  registerBtn.disabled = true;
  say('Waiting for your device…');
  try {
    const label = /iPhone|iPad|Macintosh/.test(navigator.userAgent) ? 'iPhone / Mac'
      : /Android/.test(navigator.userAgent) ? 'Android' : 'This computer';
    await registerPasskey(label);
    say('Registered. Authentication is now on.', 'ok');
    setTimeout(() => { location.href = nextPath(); }, 900);
  } catch (e){
    say(e.message || 'registration failed', 'error');
    registerBtn.disabled = false;
  }
});

init();
</script>
</body>
</html>
