<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12161c;
    --panel: #1b212b;
    --panel-line: #2a323f;
    --text: #ece7db;
    --text-dim: #8b93a1;
    --amber: #e8a33d;
    --amber-dim: #6b5730;
    --teal: #4fb8ae;
    --teal-dim: #2c5b56;
    --coral: #e2574c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding:2.5vw;
  }
  .board{max-width:1400px; margin:0 auto;}

  /* Header / split-flap strip */
  .header{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:1.5rem 2rem;
    margin-bottom:1.5rem;
    display:flex; flex-direction:column; gap:1.25rem;
  }
  .header-top{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap;
    gap:1rem;
  }
  .flap-group{display:flex; gap:.4rem;}
  .flap{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:clamp(2.2rem, 5vw, 3.6rem);
    background:#0d1116;
    border:1px solid var(--panel-line);
    border-radius:4px;
    padding:.1em .25em;
    line-height:1;
    color:var(--amber);
    min-width:1.2em;
    text-align:center;
  }
  .date-block{
    font-family:'IBM Plex Mono', monospace;
    font-size:.95rem;
    color:var(--text-dim);
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .weather-now{
    display:flex; align-items:baseline; gap:.6rem;
    font-family:'IBM Plex Mono', monospace;
  }
  .weather-now .temp{font-size:2.4rem; font-weight:600; color:var(--teal);}
  .weather-now .cond{font-size:.95rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;}
  .weather-now .humidity{font-size:.85rem; color:var(--text-dim);}
  .header .hourly-strip{border-top:1px solid var(--panel-line); padding-top:1.1rem;}

  /* Grid */
  .board-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap:1.5rem;
    align-items:start;
  }
  .board-grid .card.wide{ grid-column: 1 / -1; }
  .board-grid .card.dragging{ opacity:.4; }

  .card-handle{cursor:grab; touch-action:none; user-select:none;}
  .card-handle:active{cursor:grabbing;}

  .drag-handle{
    cursor:grab; touch-action:none; user-select:none;
    color:var(--text-dim); font-size:.9rem; letter-spacing:-.1em;
    padding:0 .2em;
  }
  .drag-handle:active{cursor:grabbing;}

  .card{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:1.5rem;
  }
  .card h2{
    font-family:'IBM Plex Mono', monospace;
    font-size:.8rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:1rem;
    padding-bottom:.6rem;
    border-bottom:1px solid var(--panel-line);
  }

  /* Today card */
  .event-row{
    display:flex; justify-content:space-between; align-items:center; gap:1rem;
    padding:.6rem .6rem;
    margin:0 -.6rem;
    border-bottom:1px solid var(--panel-line);
    border-radius:4px;
    font-size:.95rem;
  }
  .event-row:last-child{border-bottom:none;}
  .event-row.today{background:rgba(232,163,61,.08); border-bottom-color:var(--amber-dim);}
  .event-time{
    display:flex; flex-direction:column; align-items:flex-end; gap:.1rem;
    font-family:'IBM Plex Mono', monospace;
    white-space:nowrap;
  }
  .event-day{font-size:.7rem; letter-spacing:.05em; text-transform:uppercase; color:var(--text-dim);}
  .event-day.today{color:var(--amber); font-weight:600;}
  .event-clock{color:var(--amber); font-size:.85rem;}
  .event-name{color:var(--text);}
  .empty{color:var(--text-dim); font-style:normal; font-size:.9rem; padding:.5rem 0;}

  /* Home status card */
  .status-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:.7rem 0;
    border-bottom:1px solid var(--panel-line);
  }
  .status-row:last-child{border-bottom:none;}
  .status-label{font-size:.9rem; color:var(--text-dim);}
  .status-value{
    font-family:'IBM Plex Mono', monospace;
    font-size:1.1rem;
    font-weight:600;
  }
  .status-value.warm{color:var(--amber);}
  .status-value.calm{color:var(--teal);}
  .status-value.alert{color:var(--coral);}
  .pill{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:.7rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:.15em .55em;
    border-radius:100px;
    background:var(--amber-dim);
    color:var(--amber);
  }
  .pill.calm{background:var(--teal-dim); color:var(--teal);}
  .pill.alert{background:#5a2a26; color:var(--coral);}

  /* Week strip */
  .week-strip{display:flex; flex-direction:column; gap:.1rem;}
  .week-row{
    display:grid; grid-template-columns: 3.2em 1fr auto;
    align-items:center; gap:.75rem;
    padding:.55rem 0;
    border-bottom:1px solid var(--panel-line);
  }
  .week-row:last-child{border-bottom:none;}
  .week-day{
    font-family:'IBM Plex Mono', monospace;
    font-size:.8rem; color:var(--text-dim); text-transform:uppercase;
  }
  .week-bar-track{
    height:6px; background:#0d1116; border-radius:100px; position:relative;
  }
  .week-bar-fill{
    position:absolute; top:0; bottom:0;
    background:linear-gradient(90deg, var(--teal), var(--amber));
    border-radius:100px;
  }
  .week-temps{
    font-family:'IBM Plex Mono', monospace;
    font-size:.85rem;
    white-space:nowrap;
  }
  .week-temps .hi{color:var(--amber);}
  .week-temps .lo{color:var(--text-dim); margin-left:.4em;}

  .hourly-strip{display:flex; gap:1.25rem; overflow-x:auto; padding-bottom:.25rem;}
  .hour-block{display:flex; flex-direction:column; align-items:center; gap:.3rem; min-width:3em;}
  .hour-label{font-family:'IBM Plex Mono', monospace; font-size:.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em;}
  .hour-temp{font-family:'IBM Plex Mono', monospace; font-size:1.05rem; font-weight:600; color:var(--amber);}
  .hour-humidity{font-family:'IBM Plex Mono', monospace; font-size:.7rem; color:var(--text-dim);}

  .ring-card{margin-top:1.5rem;}
  .ring-strip{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap:1.25rem;
  }
  .ring-cam{display:flex; flex-direction:column; gap:.5rem; cursor:pointer; background:none; border:none; padding:0; text-align:left; font:inherit; color:inherit;}
  .ring-thumb{
    width:100%; aspect-ratio:16/9; object-fit:cover;
    border-radius:4px; background:#0d1116; border:1px solid var(--panel-line);
  }
  .ring-cam-foot{display:flex; align-items:center; justify-content:space-between; gap:.5rem;}
  .ring-cam-name{font-size:.95rem; color:var(--text);}

  .ring-modal{
    display:none;
    position:fixed; inset:0; z-index:100;
    background:rgba(10,12,16,.85);
    align-items:center; justify-content:center;
    padding:3vw;
  }
  .ring-modal.open{display:flex;}
  .ring-modal-inner{max-width:min(90vw, 960px); width:100%;}
  .ring-modal-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:.75rem; color:var(--text); font-family:'IBM Plex Mono', monospace;
  }
  .ring-modal-close{
    background:var(--panel); border:1px solid var(--panel-line); color:var(--text);
    border-radius:4px; padding:.4em .8em; cursor:pointer; font-family:inherit; font-size:.85rem;
  }
  .ring-modal video{width:100%; display:block; border-radius:6px; background:#000; aspect-ratio:16/9; object-fit:contain;}
  .ring-modal-status{
    text-align:center; color:var(--text-dim); font-family:'IBM Plex Mono', monospace;
    font-size:.85rem; padding:1rem 0;
  }
  .ring-modal-status.error{color:var(--coral);}

  .controls-card{margin-top:1.5rem;}
  .controls-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap:1rem;
  }
  .control-tile{
    background:#0d1116; border:1px solid var(--panel-line); border-radius:6px;
    padding:.85rem; display:flex; flex-direction:column; gap:.6rem;
  }
  .control-head{display:flex; align-items:center; justify-content:space-between; gap:.5rem;}
  .control-head-left{display:flex; align-items:center; gap:.4rem; min-width:0;}
  .control-name{font-size:.85rem; color:var(--text);}
  .control-tile.dragging{opacity:.4;}
  .control-value{font-family:'IBM Plex Mono', monospace; font-size:.75rem; color:var(--text-dim);}
  .control-slider{width:100%; accent-color:var(--teal);}
  .control-effect{
    width:100%; background:var(--panel); color:var(--text); border:1px solid var(--panel-line);
    border-radius:4px; padding:.3em .4em; font-family:inherit; font-size:.78rem;
  }
  .control-presets{display:flex; gap:.35rem;}
  .control-preset{
    flex:1; background:var(--panel); color:var(--text-dim); border:1px solid var(--panel-line);
    border-radius:4px; padding:.3em 0; font-family:'IBM Plex Mono', monospace; font-size:.72rem;
    cursor:pointer;
  }
  .control-preset:hover:not(:disabled){color:var(--text); border-color:var(--teal);}
  .control-preset:disabled{opacity:.5; cursor:not-allowed;}

  .thermo-row{display:flex; align-items:center; justify-content:center; gap:.85rem;}
  .thermo-btn{
    width:2em; height:2em; border-radius:50%; flex-shrink:0;
    background:var(--panel); border:1px solid var(--panel-line); color:var(--text);
    font-size:1.1rem; line-height:1; cursor:pointer;
  }
  .thermo-btn:disabled{opacity:.5; cursor:not-allowed;}
  .thermo-temp{
    font-family:'IBM Plex Mono', monospace; font-size:1.3rem; font-weight:600;
    color:var(--teal); min-width:3em; text-align:center;
  }

  .media-buttons{display:flex; gap:.4rem;}
  .media-btn{
    flex:1; background:var(--panel); border:1px solid var(--panel-line); color:var(--text);
    border-radius:4px; padding:.35em 0; font-family:inherit; font-size:.85rem; cursor:pointer;
  }
  .media-btn:hover:not(:disabled){border-color:var(--teal);}
  .media-btn:disabled{opacity:.5; cursor:not-allowed;}

  .toggle{position:relative; display:inline-block; width:2.4em; height:1.4em; flex-shrink:0;}
  .toggle input{opacity:0; width:0; height:0; position:absolute;}
  .toggle-track{
    position:absolute; inset:0; background:#12161c; border:1px solid var(--panel-line);
    border-radius:100px; cursor:pointer; transition:background .15s ease;
  }
  .toggle-track::before{
    content:''; position:absolute; height:1em; width:1em; left:.15em; top:.15em;
    background:var(--text-dim); border-radius:50%; transition:transform .15s ease, background .15s ease;
  }
  .toggle input:checked + .toggle-track{background:var(--teal-dim); border-color:var(--teal);}
  .toggle input:checked + .toggle-track::before{transform:translateX(1em); background:var(--teal);}
  .toggle input:disabled + .toggle-track{opacity:.5; cursor:not-allowed;}

  .updated{
    margin-top:1.5rem;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:.75rem;
    color:var(--text-dim);
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .updated.error{color:var(--coral);}

  @media (prefers-reduced-motion: no-preference){
    .flap{ transition: transform .15s ease; }
  }
</style>
</head>
<body>
  <div class="board">
    <div class="header">
      <div class="header-top">
        <div>
          <div class="flap-group" id="clock"></div>
          <div class="date-block" id="date" style="margin-top:.6rem;"></div>
        </div>
        <div class="weather-now">
          <span class="temp" id="temp-now">--°</span>
          <span class="cond" id="cond-now">loading</span>
          <span class="humidity" id="humidity-now"></span>
        </div>
      </div>
      <div class="hourly-strip" id="hourly-strip"></div>
    </div>

    <div class="board-grid" id="board-grid">
      <div class="card" data-tile-id="today">
        <h2 class="card-handle">Today &amp; upcoming</h2>
        <div id="events"><div class="empty">Loading&hellip;</div></div>
      </div>

      <div class="card" data-tile-id="home-status">
        <h2 class="card-handle">Home status</h2>
        <div id="home-status"><div class="empty">Loading&hellip;</div></div>
      </div>

      <div class="card" data-tile-id="week">
        <h2 class="card-handle">This week</h2>
        <div class="week-strip" id="week"></div>
      </div>

      <div class="card wide" data-tile-id="controls" id="controls-section" style="display:none;">
        <h2 class="card-handle">Controls</h2>
        <div class="controls-grid" id="controls-grid"></div>
      </div>

      <div class="card wide" data-tile-id="ring" id="ring-section" style="display:none;">
        <h2 class="card-handle">Ring cameras</h2>
        <div class="ring-strip" id="ring-cams"></div>
      </div>
    </div>

    <div class="updated" id="updated">Connecting&hellip;</div>
  </div>

  <div class="ring-modal" id="ring-modal">
    <div class="ring-modal-inner">
      <div class="ring-modal-head">
        <span id="ring-modal-name"></span>
        <button class="ring-modal-close" id="ring-modal-close">Close</button>
      </div>
      <div class="ring-modal-status" id="ring-modal-status">Connecting&hellip;</div>
      <video id="ring-modal-video" muted autoplay playsinline style="display:none;"></video>
    </div>
  </div>

<script>
const WMO = {
  0:'Clear', 1:'Mostly clear', 2:'Partly cloudy', 3:'Overcast',
  45:'Fog', 48:'Fog',
  51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
  61:'Light rain', 63:'Rain', 65:'Heavy rain',
  71:'Light snow', 73:'Snow', 75:'Heavy snow',
  80:'Showers', 81:'Showers', 82:'Heavy showers',
  95:'Thunderstorms'
};

function renderClock(){
  const now = new Date();
  const h = String(now.getHours() % 12 || 12).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
  const digits = (h + m).split('');
  const el = document.getElementById('clock');
  el.innerHTML = '';
  digits.forEach(d => {
    const f = document.createElement('div');
    f.className = 'flap';
    f.textContent = d;
    el.appendChild(f);
  });
  const ampmEl = document.createElement('div');
  ampmEl.className = 'flap';
  ampmEl.style.fontSize = '1.1rem';
  ampmEl.style.color = 'var(--text-dim)';
  ampmEl.textContent = ampm;
  el.appendChild(ampmEl);

  document.getElementById('date').textContent = now.toLocaleDateString('en-US', {
    weekday:'long', month:'long', day:'numeric'
  });
}

function eventDate(iso){
  if (!iso) return null;
  // All-day events are date-only ("2026-07-30") - parse at noon local time
  // so they land on the correct calendar day regardless of timezone offset.
  const d = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? new Date(iso + 'T12:00:00') : new Date(iso);
  return isNaN(d) ? null : d;
}

function fmtEventDay(iso){
  const d = eventDate(iso);
  if (!d) return '';
  const today = new Date();
  if (d.toDateString() === today.toDateString()) return 'Today';
  return d.toLocaleDateString('en-US', {weekday:'short'});
}

function fmtEventClock(iso){
  if (!iso || /^\d{4}-\d{2}-\d{2}$/.test(iso)) return 'All day';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
}

function renderEvents(events){
  const el = document.getElementById('events');
  if (!events || events.length === 0){
    el.innerHTML = '<div class="empty">Nothing on the calendar.</div>';
    return;
  }
  el.innerHTML = events.slice(0,7).map(e => {
    const day = fmtEventDay(e.start);
    const isToday = day === 'Today';
    return `
      <div class="event-row ${isToday ? 'today' : ''}">
        <span class="event-name">${escapeHtml(e.summary || 'Untitled')}</span>
        <span class="event-time">
          <span class="event-day ${isToday ? 'today' : ''}">${day}</span>
          <span class="event-clock">${fmtEventClock(e.start)}</span>
        </span>
      </div>
    `;
  }).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderHomeStatus(entities){
  const el = document.getElementById('home-status');
  if (!entities){
    el.innerHTML = '<div class="empty">Home Assistant unavailable.</div>';
    return;
  }
  const byPrefix = (p) => entities.filter(e => e.entity_id.startsWith(p));

  const covers = byPrefix('cover.');
  const lights = byPrefix('light.').filter(e => e.state === 'on');
  const media = byPrefix('media_player.').filter(e => e.state === 'playing');
  const motionEvents = entities.filter(e =>
    e.entity_id.startsWith('event.') &&
    e.attributes?.device_class === 'motion' &&
    !isNaN(new Date(e.state))
  );

  const recentMotion = motionEvents.filter(e => {
    const mins = (Date.now() - new Date(e.state)) / 60000;
    return mins < 15;
  });

  let rows = [];

  if (covers.length){
    covers.forEach(c => {
      const pos = c.attributes.current_position;
      const label = c.attributes.friendly_name || c.entity_id;
      rows.push(`
        <div class="status-row">
          <span class="status-label">${escapeHtml(label)}</span>
          <span class="status-value calm">${pos != null ? pos + '% open' : c.state}</span>
        </div>
      `);
    });
  }

  rows.push(`
    <div class="status-row">
      <span class="status-label">Lights on</span>
      <span class="status-value ${lights.length ? 'warm' : 'calm'}">${lights.length}</span>
    </div>
  `);

  rows.push(`
    <div class="status-row">
      <span class="status-label">Playing now</span>
      <span class="status-value ${media.length ? 'warm' : 'calm'}">${media.length ? media.length + ' zone' + (media.length>1?'s':'') : 'Quiet'}</span>
    </div>
  `);

  rows.push(`
    <div class="status-row">
      <span class="status-label">Motion (last 15 min)</span>
      <span class="status-value ${recentMotion.length ? 'alert' : 'calm'}">
        ${recentMotion.length ? recentMotion.length + ' <span class="pill alert">recent</span>' : 'None'}
      </span>
    </div>
  `);

  el.innerHTML = rows.join('');
}

function renderWeek(daily){
  const el = document.getElementById('week');
  if (!daily){ el.innerHTML = '<div class="empty">Unavailable.</div>'; return; }
  const days = daily.time;
  const highs = daily.temperature_2m_max;
  const lows = daily.temperature_2m_min;
  const globalMax = Math.max(...highs);
  const globalMin = Math.min(...lows);
  const range = globalMax - globalMin || 1;

  el.innerHTML = days.map((d, i) => {
    const date = new Date(d + 'T12:00:00');
    const label = i === 0 ? 'Today' : date.toLocaleDateString('en-US', {weekday:'short'});
    const left = ((lows[i] - globalMin) / range) * 100;
    const width = ((highs[i] - lows[i]) / range) * 100;
    return `
      <div class="week-row">
        <span class="week-day">${label}</span>
        <div class="week-bar-track">
          <div class="week-bar-fill" style="left:${left}%; width:${Math.max(width,6)}%"></div>
        </div>
        <span class="week-temps"><span class="hi">${Math.round(highs[i])}&deg;</span><span class="lo">${Math.round(lows[i])}&deg;</span></span>
      </div>
    `;
  }).join('');
}

function renderHourly(hourly){
  const el = document.getElementById('hourly-strip');
  if (!hourly || !hourly.time || !hourly.time.length){
    el.innerHTML = '';
    return;
  }

  const now = new Date();
  let startIdx = hourly.time.findIndex(t => new Date(t) >= now);
  if (startIdx === -1) startIdx = 0;
  const slice = hourly.time.slice(startIdx, startIdx + 12);

  el.innerHTML = slice.map((t, i) => {
    const idx = startIdx + i;
    const label = i === 0 ? 'Now' : new Date(t).toLocaleTimeString('en-US', {hour:'numeric'});
    const temp = Math.round(hourly.temperature_2m[idx]);
    const humidity = hourly.relative_humidity_2m ? hourly.relative_humidity_2m[idx] : null;
    return `
      <div class="hour-block">
        <span class="hour-label">${label}</span>
        <span class="hour-temp">${temp}&deg;</span>
        ${humidity != null ? `<span class="hour-humidity">${Math.round(humidity)}%</span>` : ''}
      </div>
    `;
  }).join('');
}

const TILE_ORDER_KEY = 'dashboard-tile-order';
const CONTROL_ORDER_KEY = 'dashboard-control-order';

function loadOrder(key){
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; }
}
function saveOrder(key, ids){
  localStorage.setItem(key, JSON.stringify(ids));
}

// Reorders a data array to match a previously saved id order; anything not
// in the saved order (new controls) is appended at the end.
function applySavedOrder(items, key, idFn){
  const saved = loadOrder(key);
  if (!saved.length) return items;
  const byId = new Map(items.map(it => [idFn(it), it]));
  const ordered = [];
  for (const id of saved){
    if (byId.has(id)){ ordered.push(byId.get(id)); byId.delete(id); }
  }
  ordered.push(...byId.values());
  return ordered;
}

// Moves existing DOM nodes (doesn't rebuild them) to match a saved order -
// for containers whose children persist across refresh() cycles.
function reorderDomToSaved(container, itemSelector, key){
  const saved = loadOrder(key);
  if (!saved.length) return;
  const byId = new Map([...container.querySelectorAll(itemSelector)].map(el => [el.dataset.tileId, el]));
  for (const id of saved){
    const el = byId.get(id);
    if (el) container.appendChild(el);
  }
}

// Native HTML5 drag-and-drop, delegated on the container so it keeps
// working after renderControls() rebuilds the tiles' innerHTML each
// refresh. Mouse-oriented, matching this dashboard's primary (desktop) use.
function makeSortable(container, { handleSelector, itemSelector, storageKey }){
  const finishDrag = () => {
    const dragging = container.querySelector(`${itemSelector}.dragging`);
    if (!dragging) return;
    dragging.classList.remove('dragging');
    dragging.removeAttribute('draggable');
    saveOrder(storageKey, [...container.querySelectorAll(itemSelector)].map(el => el.dataset.tileId));
  };

  container.addEventListener('mousedown', (e) => {
    const handle = e.target.closest(handleSelector);
    if (!handle) return;
    const item = handle.closest(itemSelector);
    if (item) item.setAttribute('draggable', 'true');
  });
  // Self-healing: covers both "mousedown on a handle but never dragged" and
  // (as a fallback) a drag session whose dragend/drop never fired - so a
  // stuck tile can't outlive the very next click anywhere on the page.
  document.addEventListener('mouseup', () => {
    finishDrag();
    container.querySelectorAll(`${itemSelector}[draggable="true"]:not(.dragging)`)
      .forEach(el => el.removeAttribute('draggable'));
  });
  container.addEventListener('dragstart', (e) => {
    const item = e.target.closest(itemSelector);
    if (!item || item.getAttribute('draggable') !== 'true'){ e.preventDefault(); return; }
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', '');
    item.classList.add('dragging');
  });
  container.addEventListener('dragover', (e) => {
    const dragging = container.querySelector('.dragging');
    if (!dragging) return;
    e.preventDefault();
    const target = e.target.closest(itemSelector);
    if (!target || target === dragging) return;
    const rect = target.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    target.parentNode.insertBefore(dragging, before ? target : target.nextSibling);
  });
  container.addEventListener('drop', (e) => e.preventDefault());
  container.addEventListener('dragend', finishDrag);
}

function renderControls(controls){
  const section = document.getElementById('controls-section');
  const el = document.getElementById('controls-grid');
  if (!controls || controls.length === 0){
    section.style.display = 'none';
    return;
  }
  section.style.display = '';
  controls = applySavedOrder(controls, CONTROL_ORDER_KEY, c => c.id);
  const POSITION_PRESETS = [0, 25, 50, 75, 100];

  el.innerHTML = controls.map(c => {
    if (c.type === 'light'){
      const enabled = c.on && c.available;
      const effects = (c.effectList || []).filter(e => e.toLowerCase() !== 'off');
      return `
        <div class="control-tile" data-tile-id="${c.id}">
          <div class="control-head">
            <span class="control-head-left">
              <span class="drag-handle" title="Drag to reorder">&#8942;&#8942;</span>
              <span class="control-name">${escapeHtml(c.name)}</span>
            </span>
            <label class="toggle">
              <input type="checkbox" class="ctl-toggle" data-id="${c.id}" ${c.on ? 'checked' : ''} ${c.available ? '' : 'disabled'}>
              <span class="toggle-track"></span>
            </label>
          </div>
          ${c.simple ? '' : `
            <input type="range" class="control-slider ctl-brightness" data-id="${c.id}" min="0" max="255" value="${c.brightness ?? 128}" ${enabled ? '' : 'disabled'}>
            ${effects.length ? `
              <select class="control-effect ctl-effect" data-id="${c.id}" ${enabled ? '' : 'disabled'}>
                <option value="">No effect</option>
                ${effects.map(e => `<option value="${escapeHtml(e)}" ${c.effect === e ? 'selected' : ''}>${escapeHtml(e)}</option>`).join('')}
              </select>
            ` : ''}
          `}
        </div>
      `;
    }
    if (c.type === 'cover'){
      const label = c.position != null ? c.position + '%' : (c.isClosed ? 'Closed' : 'Open');
      return `
        <div class="control-tile" data-tile-id="${c.id}">
          <div class="control-head">
            <span class="control-head-left">
              <span class="drag-handle" title="Drag to reorder">&#8942;&#8942;</span>
              <span class="control-name">${escapeHtml(c.name)}</span>
            </span>
            <span class="control-value">${label}</span>
          </div>
          <input type="range" class="control-slider ctl-position" data-id="${c.id}" min="0" max="100" value="${c.position ?? 0}" ${c.available ? '' : 'disabled'}>
          <div class="control-presets">
            ${POSITION_PRESETS.map(p => `<button type="button" class="control-preset ctl-preset" data-id="${c.id}" data-position="${p}" ${c.available ? '' : 'disabled'}>${p}%</button>`).join('')}
          </div>
        </div>
      `;
    }
    if (c.type === 'nest'){
      const modeLabel = (m) => (c.hvacModeLabels && c.hvacModeLabels[m]) || (m.charAt(0).toUpperCase() + m.slice(1));
      const runningNote = (c.hvacStatus && c.hvacStatus !== 'off') ? ' · ' + modeLabel(c.hvacStatus) : '';
      return `
        <div class="control-tile" data-tile-id="${c.id}">
          <div class="control-head">
            <span class="control-head-left">
              <span class="drag-handle" title="Drag to reorder">&#8942;&#8942;</span>
              <span class="control-name">${escapeHtml(c.name)}</span>
            </span>
            <select class="control-effect ctl-hvac" data-id="${c.id}" ${c.available ? '' : 'disabled'}>
              ${(c.hvacModes || []).map(m => `<option value="${m}" ${c.hvacMode === m ? 'selected' : ''}>${modeLabel(m)}</option>`).join('')}
            </select>
          </div>
          <div class="thermo-row">
            <button type="button" class="thermo-btn ctl-temp-down" data-id="${c.id}" data-step="${c.step}" data-min="${c.minTemp}" data-max="${c.maxTemp}" ${c.available ? '' : 'disabled'}>&minus;</button>
            <span class="thermo-temp" data-target-for="${c.id}">${c.targetTemp != null ? Math.round(c.targetTemp) + '°' : '--'}</span>
            <button type="button" class="thermo-btn ctl-temp-up" data-id="${c.id}" data-step="${c.step}" data-min="${c.minTemp}" data-max="${c.maxTemp}" ${c.available ? '' : 'disabled'}>+</button>
          </div>
          <div class="control-value">
            Now ${c.currentTemp != null ? Math.round(c.currentTemp) + '°' : '--'}${c.currentHumidity != null ? ' · ' + Math.round(c.currentHumidity) + '%' : ''}${runningNote}
          </div>
        </div>
      `;
    }
    if (c.type === 'media'){
      const status = c.appName ? c.appName : (c.state === 'off' ? 'Off' : 'Idle');
      return `
        <div class="control-tile" data-tile-id="${c.id}">
          <div class="control-head">
            <span class="control-head-left">
              <span class="drag-handle" title="Drag to reorder">&#8942;&#8942;</span>
              <span class="control-name">${escapeHtml(c.name)}</span>
            </span>
            <label class="toggle">
              <input type="checkbox" class="ctl-media-power" data-id="${c.id}" ${c.state !== 'off' ? 'checked' : ''} ${c.available ? '' : 'disabled'}>
              <span class="toggle-track"></span>
            </label>
          </div>
          <div class="control-value">${escapeHtml(status)}</div>
          <div class="media-buttons">
            <button type="button" class="media-btn ctl-media-action" data-id="${c.id}" data-action="previous" ${c.available ? '' : 'disabled'}>&#9198;</button>
            <button type="button" class="media-btn ctl-media-action" data-id="${c.id}" data-action="play_pause" ${c.available ? '' : 'disabled'}>&#9199;</button>
            <button type="button" class="media-btn ctl-media-action" data-id="${c.id}" data-action="next" ${c.available ? '' : 'disabled'}>&#9197;</button>
          </div>
          <div class="media-buttons">
            <button type="button" class="media-btn ctl-media-action" data-id="${c.id}" data-action="volume_down" ${c.available ? '' : 'disabled'}>&minus;</button>
            <button type="button" class="media-btn ctl-media-action" data-id="${c.id}" data-action="mute" ${c.available ? '' : 'disabled'}>Mute</button>
            <button type="button" class="media-btn ctl-media-action" data-id="${c.id}" data-action="volume_up" ${c.available ? '' : 'disabled'}>+</button>
          </div>
          ${(c.sourceList || []).length ? `
            <select class="control-effect ctl-media-source" data-id="${c.id}" ${c.available ? '' : 'disabled'}>
              <option value="">Launch app&hellip;</option>
              ${c.sourceList.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}
            </select>
          ` : ''}
        </div>
      `;
    }
    return '';
  }).join('');

  el.querySelectorAll('.ctl-toggle').forEach(input => {
    input.addEventListener('change', () => setControl(input.dataset.id, { on: input.checked }));
  });
  el.querySelectorAll('.ctl-brightness').forEach(input => {
    input.addEventListener('change', () => setControl(input.dataset.id, { on: true, brightness: Number(input.value) }));
  });
  el.querySelectorAll('.ctl-effect').forEach(select => {
    select.addEventListener('change', () => {
      if (select.value) setControl(select.dataset.id, { on: true, effect: select.value });
    });
  });
  el.querySelectorAll('.ctl-position').forEach(input => {
    input.addEventListener('change', () => setControl(input.dataset.id, { position: Number(input.value) }));
  });
  el.querySelectorAll('.ctl-preset').forEach(button => {
    button.addEventListener('click', () => setControl(button.dataset.id, { position: Number(button.dataset.position) }));
  });
  el.querySelectorAll('.ctl-hvac').forEach(select => {
    select.addEventListener('change', () => setControl(select.dataset.id, { hvacMode: select.value }));
  });
  el.querySelectorAll('.ctl-temp-up, .ctl-temp-down').forEach(button => {
    button.addEventListener('click', () => {
      const id = button.dataset.id;
      const step = Number(button.dataset.step) || 1;
      const min = Number(button.dataset.min);
      const max = Number(button.dataset.max);
      const tile = button.closest('.control-tile');
      const tempEl = tile.querySelector('.thermo-temp');
      const hvacSelect = tile.querySelector('.ctl-hvac');
      const current = parseFloat(tempEl.textContent) || 0;
      const delta = button.classList.contains('ctl-temp-up') ? step : -step;
      const next = Math.min(max, Math.max(min, current + delta));
      tempEl.textContent = Math.round(next) + '°';
      setControl(id, { temperature: next, hvacMode: hvacSelect ? hvacSelect.value : undefined });
    });
  });
  el.querySelectorAll('.ctl-media-power').forEach(input => {
    input.addEventListener('change', () => setControl(input.dataset.id, { action: input.checked ? 'turn_on' : 'turn_off' }));
  });
  el.querySelectorAll('.ctl-media-action').forEach(button => {
    button.addEventListener('click', () => setControl(button.dataset.id, { action: button.dataset.action }));
  });
  el.querySelectorAll('.ctl-media-source').forEach(select => {
    select.addEventListener('change', () => {
      if (select.value) setControl(select.dataset.id, { action: 'select_source', source: select.value });
    });
  });
}

async function setControl(id, payload){
  try {
    await fetch(`/api/ha/control/${id}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  } catch (e){
    // next refresh() cycle reconciles the UI with actual HA state either way
  }
}

function renderRing(cameras){
  const section = document.getElementById('ring-section');
  const el = document.getElementById('ring-cams');
  if (!cameras || cameras.length === 0){
    section.style.display = 'none';
    return;
  }
  section.style.display = '';
  el.innerHTML = cameras.map(c => {
    const label = c.dingActive ? 'Ding' : (c.motionActive ? 'Motion' : 'Idle');
    const cls = (c.dingActive || c.motionActive) ? 'alert' : 'calm';
    return `
      <button type="button" class="ring-cam" data-name="${escapeHtml(c.name)}" data-id="${c.id}">
        <img class="ring-thumb" src="${c.snapshotUrl}?t=${Date.now()}" alt="${escapeHtml(c.name)}" loading="lazy" />
        <div class="ring-cam-foot">
          <span class="ring-cam-name">${escapeHtml(c.name)}</span>
          <span class="pill ${cls}">${label}</span>
        </div>
      </button>
    `;
  }).join('');

  el.querySelectorAll('.ring-cam').forEach(btn => {
    btn.addEventListener('click', () => openRingModal(btn.dataset.name, btn.dataset.id));
  });
}

let currentPc = null;
let currentSignalWs = null;

function setRingModalStatus(text, isError){
  const status = document.getElementById('ring-modal-status');
  const video = document.getElementById('ring-modal-video');
  status.textContent = text;
  status.className = 'ring-modal-status' + (isError ? ' error' : '');
  status.style.display = text ? '' : 'none';
  video.style.display = text ? 'none' : '';
}

function openRingModal(name, entityId){
  document.getElementById('ring-modal-name').textContent = name;
  document.getElementById('ring-modal').classList.add('open');
  setRingModalStatus('Connecting…', false);
  stopRingModalPlayback();

  const video = document.getElementById('ring-modal-video');
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  currentPc = pc;
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });

  pc.ontrack = (e) => {
    video.srcObject = e.streams[0];
    setRingModalStatus('', false);
  };
  pc.onconnectionstatechange = () => {
    if (currentPc === pc && ['failed', 'disconnected', 'closed'].includes(pc.connectionState)){
      setRingModalStatus('Live view disconnected', true);
    }
  };

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/api/ring/webrtc/${entityId}`);
  currentSignalWs = ws;

  pc.onicecandidate = (e) => {
    if (e.candidate && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate.toJSON() }));
    }
  };

  ws.addEventListener('open', async () => {
    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription.sdp }));
    } catch (e){
      setRingModalStatus('Unable to start live view', true);
    }
  });

  ws.addEventListener('message', async (evt) => {
    let msg;
    try { msg = JSON.parse(evt.data); } catch { return; }
    if (msg.type === 'answer'){
      try { await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp }); }
      catch { setRingModalStatus('Unable to start live view', true); }
    } else if (msg.type === 'candidate' && msg.candidate){
      try { await pc.addIceCandidate(msg.candidate); } catch { /* ignore late/duplicate candidates */ }
    } else if (msg.type === 'error'){
      setRingModalStatus(msg.message || 'Live view error', true);
    }
  });

  ws.addEventListener('close', () => {
    if (currentSignalWs === ws) setRingModalStatus('Live view disconnected', true);
  });
  ws.addEventListener('error', () => {
    if (currentSignalWs === ws) setRingModalStatus('Unable to reach live view', true);
  });
}

function stopRingModalPlayback(){
  if (currentSignalWs){
    try { currentSignalWs.close(); } catch {}
    currentSignalWs = null;
  }
  if (currentPc){
    try { currentPc.close(); } catch {}
    currentPc = null;
  }
  const video = document.getElementById('ring-modal-video');
  if (video.srcObject){
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
}

function closeRingModal(){
  document.getElementById('ring-modal').classList.remove('open');
  stopRingModalPlayback();
}

async function refresh(){
  try {
    const res = await fetch('/api/dashboard');
    const data = await res.json();

    if (data.weather?.current){
      document.getElementById('temp-now').textContent = Math.round(data.weather.current.temperature_2m) + '\u00b0';
      document.getElementById('cond-now').textContent = WMO[data.weather.current.weather_code] || 'Unknown';
      const humidity = data.weather.current.relative_humidity_2m;
      document.getElementById('humidity-now').textContent = humidity != null ? humidity + '% humidity' : '';
    }
    renderWeek(data.weather?.daily);
    renderHourly(data.weather?.hourly);
    renderEvents(data.calendar);
    renderHomeStatus(data.homeAssistant);
    renderControls(data.controls);
    renderRing(data.ring);

    const updEl = document.getElementById('updated');
    if (data.errors && data.errors.length){
      updEl.textContent = 'Updated ' + new Date().toLocaleTimeString() + ' \u2014 ' + data.errors.join(' / ');
      updEl.className = 'updated error';
    } else {
      updEl.textContent = 'Updated ' + new Date().toLocaleTimeString();
      updEl.className = 'updated';
    }
  } catch (e){
    document.getElementById('updated').textContent = 'Connection lost \u2014 retrying\u2026';
    document.getElementById('updated').className = 'updated error';
  }
}

document.getElementById('ring-modal-close').addEventListener('click', closeRingModal);
document.getElementById('ring-modal').addEventListener('click', (e) => {
  if (e.target.id === 'ring-modal') closeRingModal();
});

const boardGrid = document.getElementById('board-grid');
reorderDomToSaved(boardGrid, '.card', TILE_ORDER_KEY);
makeSortable(boardGrid, { handleSelector: '.card-handle', itemSelector: '.card', storageKey: TILE_ORDER_KEY });
makeSortable(document.getElementById('controls-grid'), { handleSelector: '.drag-handle', itemSelector: '.control-tile', storageKey: CONTROL_ORDER_KEY });

renderClock();
setInterval(renderClock, 1000 * 15);
refresh();
setInterval(refresh, 60 * 1000);
</script>
